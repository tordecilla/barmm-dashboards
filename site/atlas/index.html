<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eef5ef"><title>BARMM Data Atlas</title><link rel="stylesheet" href="atlas.css?v=remove-sparse-20261013"><script src="vendor/d3.min.js" defer></script><script src="atlas.js?v=remove-sparse-20261013" defer></script></head>
<body>
<a class="skip" href="#workspace">Skip to data</a>
<aside id="indicator-nav"><div class="nav-header"><a href="./" class="nav-title">BARMM Data Atlas</a><div class="nav-subtitle">Indicators</div></div><div id="indicator-list" role="navigation" aria-label="Indicators"></div></aside>
<button id="nav-toggle" aria-label="Toggle indicator navigation" aria-controls="indicator-nav" aria-expanded="true">&#8249;</button><div id="nav-overlay" hidden></div>
<header><a class="identity" href="./">BARMM Data Atlas</a><nav role="tablist" aria-label="Views"><button role="tab" aria-selected="true" aria-controls="view-tables" data-view="tables">Data Tables</button><button role="tab" aria-selected="false" aria-controls="view-map" data-view="map">Maps</button><button role="tab" aria-selected="false" aria-controls="view-charts" data-view="charts">Charts</button><button role="tab" aria-selected="false" aria-controls="view-sources" data-view="sources">Sources</button></nav><div class="downloads"><a href="observations.csv" download>CSV</a><a href="data.json" download>JSON</a></div></header>
<div class="filters"><label>Year<select id="year"></select></label><label>View by<select id="level"></select></label><label>Area<select id="province"></select></label><label class="historical"><input type="checkbox" id="sulu">Historical Sulu</label><div id="breakdowns" class="breakdown-controls" hidden><label id="category-label" hidden><span id="category-title">Category</span><select id="category"><option value="all">Total / all groups</option></select></label><label id="period-label">Period<select id="period"><option value="0">Annual total</option></select></label><label id="sex-label">Sex / spouse<select id="sex"><option value="all">Both sexes</option></select></label><label id="age-label">Age group<select id="age-group"><option value="all">All ages</option></select></label></div></div>
<main id="workspace">
<section id="view-map" class="view" role="tabpanel" aria-label="Maps" hidden><div id="map"><svg aria-label="BARMM locality boundaries"></svg><div id="tooltip" role="status"></div></div><div class="map-heading"><h1 id="map-title"></h1><p id="map-subtitle"></p></div><div class="map-bottom"><div id="legend"></div><span id="map-note"></span></div><div class="map-actions"><button id="reset-map" type="button">Reset map</button><button id="indicator-source" type="button">Source</button></div></section>
<section id="view-charts" class="view scroll-view" role="tabpanel" aria-label="Charts" hidden><div class="content"><h1 class="view-title" id="chart-title"></h1><p class="view-subtitle" id="chart-subtitle"></p><div id="chart"></div></div></section>
<section id="view-tables" class="view scroll-view" role="tabpanel" aria-label="Data Tables"><div class="content"><div class="table-tools"><div><h1 class="view-title" id="table-title"></h1><p id="table-count" class="view-subtitle"></p></div><div><label class="search"><span class="sr-only">Search places</span><input id="search" type="search" placeholder="Search places"></label><button id="export" type="button">Download CSV</button></div></div><p id="indicator-note" class="indicator-note"></p><div class="table-scroll"><table><thead><tr><th scope="col"><button id="sort-place">Place</button></th><th scope="col">Parent area</th><th scope="col"><button id="sort-value">Value</button></th><th scope="col" id="extra-heading">Confidence interval</th><th scope="col">Source</th></tr></thead><tbody id="rows"></tbody></table></div><div id="pagination"></div></div></section>
<section id="view-sources" class="view scroll-view" role="tabpanel" aria-label="Sources" hidden><div class="content"><h1 class="view-title">Sources</h1><div id="method" class="indicator-sources"></div><div class="catalog-tools"><label><span class="sr-only">Search sources</span><input type="search" id="source-search" placeholder="Search source files"></label><label><span class="sr-only">Source status</span><select id="source-status"><option value="">All source files</option><option>Integrated</option><option>Catalogued &#183; not extracted</option></select></label></div><div id="sources"></div><div id="geo-sources"></div></div></section>
<aside id="map-data" aria-label="Indicator data"><div class="data-panel-head"><h2 id="data-panel-title"></h2><p id="data-panel-meta"></p></div><div class="data-panel-scroll"><table><thead id="map-data-head"></thead><tbody id="map-data-rows"></tbody></table></div></aside>
<aside class="profile" aria-label="Selected place" hidden><button id="close-profile" aria-label="Close place details">&times;</button><div id="profile" aria-live="polite"></div></aside>
<div id="error" role="alert" hidden></div>
</main>
</body></html>
